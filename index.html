<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>中文 · Chino Práctico</title>
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="中文">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<header><span class="zh">中文</span> <span data-i18n="appTitle">Practical Chinese</span></header>
<main id="view"></main>
<nav>
  <button id="tab-study"><div class="tab-icon-row"><span class="tab-zh">学</span><i data-lucide="graduation-cap"></i></div><span class="tab-label">Estudiar</span></button>
  <button id="tab-texts"><div class="tab-icon-row"><span class="tab-zh">文</span><i data-lucide="book-open"></i></div><span class="tab-label">Textos</span></button>
  <button id="tab-vocab"><div class="tab-icon-row"><span class="tab-zh">词</span><i data-lucide="library"></i></div><span class="tab-label">Vocabulario</span></button>
  <button id="tab-grammar"><div class="tab-icon-row"><span class="tab-zh">法</span><i data-lucide="pencil"></i></div><span class="tab-label">Gramática</span></button>
  <button id="tab-settings"><div class="tab-icon-row"><span class="tab-zh">设</span><i data-lucide="settings"></i></div><span class="tab-label">Ajustes</span></button>
</nav>
<div id="quiz-modal" class="hidden"><div class="quiz-content"><button id="quiz-close"><i data-lucide="x"></i></button><div class="quiz-status"></div><div id="quiz-hw"></div></div></div>
<div id="popup"><div class="popup-sheet"><button id="popup-close"><i data-lucide="x"></i></button><div id="popup-body"></div></div></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
