<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>中文 · Chino Práctico</title>
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="中文">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<header>
  <div class="title-group">
    <span class="zh">中文</span> <span data-i18n="appTitle">Practical Chinese</span>
  </div>
  <div class="header-actions">
    <div style="position:relative;">
      <button id="voice-btn" class="header-icon-btn" style="font-size:12px; padding:4px 8px; border-radius:6px; background:rgba(128,128,128,0.1); max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></button>
      <div id="voice-menu" class="hidden" style="position:absolute; top:100%; right:0; margin-top:4px; background:var(--card-bg); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); z-index:100; max-height:60vh; overflow-y:auto; min-width:180px; display:flex; flex-direction:column; padding:4px;"></div>
    </div>
    <div style="position:relative; display:flex; align-items:center;">
      <i data-lucide="volume-2" style="width:14px; height:14px; color:var(--muted); margin-right:2px; flex-shrink:0;"></i>
      <button id="speed-btn" class="header-icon-btn" style="font-size:13px; font-weight:700; padding:4px; color:var(--primary);"></button>
      <div id="speed-menu" class="hidden" style="position:absolute; top:100%; right:0; margin-top:4px; background:var(--card-bg); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); z-index:100; max-height:60vh; overflow-y:auto; display:flex; flex-direction:column; padding:4px; min-width:60px;"></div>
    </div>
    <button id="lang-toggle" class="header-icon-btn" aria-label="Toggle Language"><span class="lang-txt"></span></button>
    <button id="ts-toggle" class="header-icon-btn" aria-label="Toggle Text Size" style="font-weight:700; font-size:15px; padding-bottom: 2px;">Aa</button>
    <button id="theme-toggle" class="header-icon-btn" aria-label="Toggle Theme"><i data-lucide="moon"></i></button>
  </div>
</header>
<main id="view"></main>
<nav>
  <button id="tab-texts"><div class="tab-icon-row"><span class="tab-zh">文</span><i data-lucide="book-open"></i></div><span class="tab-label">Lectura</span></button>
  <button id="tab-vocab"><div class="tab-icon-row"><span class="tab-zh">词</span><i data-lucide="library"></i></div><span class="tab-label">Vocabulario</span></button>
  <button id="tab-grammar"><div class="tab-icon-row"><span class="tab-zh">法</span><i data-lucide="pencil"></i></div><span class="tab-label">Gramática</span></button>
  <button id="tab-study"><div class="tab-icon-row"><span class="tab-zh">练</span><i data-lucide="graduation-cap"></i></div><span class="tab-label">Práctica</span></button>
  <button id="tab-tutor"><div class="tab-icon-row"><span class="tab-zh">师</span><i data-lucide="bot"></i></div><span class="tab-label">Tutor</span></button>
</nav>
<div id="quiz-modal" class="hidden"><div class="quiz-content"><button id="quiz-close"><i data-lucide="x"></i></button><div class="quiz-status"></div><div id="quiz-hw"></div></div></div>
<div id="popup"><div class="popup-sheet"><button id="popup-close"><i data-lucide="x"></i></button><div id="popup-body"></div></div></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
