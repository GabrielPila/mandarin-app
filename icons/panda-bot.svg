<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="#1e293b"/>
  
  <!-- Panda Head -->
  <circle cx="50" cy="65" r="30" fill="#ffffff"/>
  
  <!-- Ears -->
  <circle cx="30" cy="45" r="10" fill="#0f172a"/>
  <circle cx="70" cy="45" r="10" fill="#0f172a"/>
  
  <!-- Eye Patches -->
  <ellipse cx="40" cy="60" rx="8" ry="12" fill="#0f172a" transform="rotate(-15 40 60)"/>
  <ellipse cx="60" cy="60" rx="8" ry="12" fill="#0f172a" transform="rotate(15 60 60)"/>
  
  <!-- Eyes -->
  <circle cx="42" cy="58" r="3" fill="#ffffff"/>
  <circle cx="58" cy="58" r="3" fill="#ffffff"/>
  <circle cx="43" cy="57" r="1" fill="#94a3b8"/>
  <circle cx="59" cy="57" r="1" fill="#94a3b8"/>
  
  <!-- Nose -->
  <ellipse cx="50" cy="70" rx="4" ry="3" fill="#0f172a"/>
  
  <!-- Smile -->
  <path d="M 45 74 Q 50 78 55 74" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Blush -->
  <ellipse cx="32" cy="68" rx="4" ry="2" fill="#ef4444" opacity="0.3"/>
  <ellipse cx="68" cy="68" rx="4" ry="2" fill="#ef4444" opacity="0.3"/>
  
  <!-- Bamboo/Scholar Hat (Cone shape) -->
  <path d="M 15 40 L 50 15 L 85 40 Q 50 45 15 40 Z" fill="#d97706"/>
  <path d="M 15 40 L 50 15 L 85 40 Q 50 45 15 40 Z" fill="none" stroke="#b45309" stroke-width="2"/>
  
  <!-- Hat Lines -->
  <line x1="50" y1="15" x2="30" y2="42" stroke="#b45309" stroke-width="1"/>
  <line x1="50" y1="15" x2="70" y2="42" stroke="#b45309" stroke-width="1"/>
  <line x1="50" y1="15" x2="50" y2="43" stroke="#b45309" stroke-width="1"/>
</svg>
