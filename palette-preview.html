<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Palette Preview (Carousel)</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: "Plus Jakarta Sans", "Inter", -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 20px 40px;
      max-width: 1400px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 10px;
      font-weight: 800;
      text-align: center;
    }

    p.subtitle {
      margin-bottom: 30px;
      color: #64748b;
      font-size: 16px;
      font-weight: 500;
      text-align: center;
    }

    .carousel-wrapper {
      position: relative;
      width: 100%;
    }

    .carousel-container {
      overflow: hidden;
      width: 100%;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      width: 100%;
    }

    .palette-section {
      flex: 0 0 100%;
      box-sizing: border-box;
      padding: 0 10px;
      opacity: 0.4;
      transition: opacity 0.4s ease;
    }

    .palette-section.active {
      opacity: 1;
    }

    .palette-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .mode-container {
      border-radius: 24px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .mode-header {
      padding: 16px 24px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .light-header {
      background: #ffffff;
      color: #475569;
    }

    .dark-header {
      background: #0f172a;
      color: #94a3b8;
    }

    .preview-area {
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
      background-size: 8px 8px !important;
    }

    /* Light Mode Specifics */
    .light-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      color: #1e293b;
    }

    .light-text {
      color: #475569;
    }

    /* Dark Mode Specifics */
    .dark-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      color: #f8fafc;
    }

    .dark-text {
      color: #94a3b8;
    }

    .mock-card {
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mock-title {
      font-size: 28px;
      font-weight: 800;
    }

    .mock-text {
      font-size: 14px;
      line-height: 1.6;
      font-weight: 500;
    }

    .typo-demo {
      margin-top: 10px;
      padding-top: 16px;
      border-top: 1px dashed rgba(128, 128, 128, 0.2);
      font-size: 15px;
    }

    .typo-demo span {
      display: block;
      margin-bottom: 6px;
    }

    .mock-btn {
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .mock-btn:hover {
      transform: translateY(-2px);
    }

    .mock-btn:active {
      transform: scale(0.97);
    }

    .swatches {
      display: flex;
      padding: 16px;
      background: #1e293b;
      gap: 8px;
      grid-column: 1 / -1;
      border-radius: 12px;
      margin-top: 20px;
    }

    .swatch {
      flex: 1;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      font-family: inherit;
    }

    /* Navigation Controls */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: white;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      font-size: 24px;
      color: #0f172a;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: #f8fafc;
      transform: translateY(-50%) scale(1.05);
    }

    .nav-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    #prevBtn {
      left: -28px;
    }

    #nextBtn {
      right: -28px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dot.active {
      background: #4f46e5;
      transform: scale(1.2);
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      #prevBtn {
        left: -10px;
      }

      #nextBtn {
        right: -10px;
      }
    }
  </style>
</head>

<body>

  <h1>Premium Color Palettes</h1>
  <p class="subtitle">Use the arrows or dots to navigate through 14 different premium color options.</p>

  <div class="carousel-wrapper">
    <button id="prevBtn" class="nav-btn">←</button>

    <div class="carousel-container">
      <div id="track" class="carousel-track">
        <!-- JavaScript will inject palettes here -->
      </div>
    </div>

    <button id="nextBtn" class="nav-btn">→</button>
  </div>

  <div id="dots" class="dots"></div>

  <script>
    const hexToRgba = (hex, alpha) => {
      let r = parseInt(hex.slice(1, 3), 16),
        g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    };

    const palettes = [
      { name: '1. Deep Indigo (Current)', prim: '#4f46e5', primDark: '#3730a3', accent: '#f59e0b' },
      { name: '2. Rich Sapphire', prim: '#0369a1', primDark: '#075985', accent: '#f97316' },
      { name: '3. Emerald & Gold', prim: '#059669', primDark: '#047857', accent: '#fbbf24' },
      { name: '4. Crimson & Slate', prim: '#e11d48', primDark: '#be123c', accent: '#0f172a' },
      { name: '5. Amethyst (Purple)', prim: '#7e22ce', primDark: '#581c87', accent: '#f43f5e' },
      { name: '6. Teal & Coral', prim: '#0d9488', primDark: '#0f766e', accent: '#f43f5e' },
      { name: '7. Monochrome Slate', prim: '#334155', primDark: '#1e293b', accent: '#3b82f6' },
      { name: '8. Sunset Orange', prim: '#ea580c', primDark: '#c2410c', accent: '#0ea5e9' },
      { name: '9. Cherry Blossom', prim: '#f43f5e', primDark: '#be123c', accent: '#334155' },
      { name: '10. Mint & Navy', prim: '#10b981', primDark: '#059669', accent: '#1e3a8a' },
      { name: '11. Lavender & Rose', prim: '#8b5cf6', primDark: '#6d28d9', accent: '#f43f5e' },
      { name: '12. Goldenrod & Charcoal', prim: '#eab308', primDark: '#ca8a04', accent: '#1f2937' },
      { name: '13. Oceanic (Cyan)', prim: '#0891b2', primDark: '#0e7490', accent: '#14b8a6' },
      { name: '14. Bordeaux (Deep Red)', prim: '#9f1239', primDark: '#881337', accent: '#f59e0b' },
      { name: '15. Matcha Green', prim: '#84cc16', primDark: '#65a30d', accent: '#d97706' },
      { name: '16. Midnight Fuchsia', prim: '#c026d3', primDark: '#a21caf', accent: '#0284c7' },
      { name: '17. Cobalt Blue', prim: '#2563eb', primDark: '#1d4ed8', accent: '#f43f5e' },
      { name: '18. Tangerine & Purple', prim: '#f97316', primDark: '#ea580c', accent: '#9333ea' },
      { name: '19. Rose Gold', prim: '#e11d48', primDark: '#9f1239', accent: '#eab308' },
      { name: '20. Forest & Peach', prim: '#15803d', primDark: '#166534', accent: '#f97316' },
      { name: '21. Ruby & Amber', prim: '#dc2626', primDark: '#b91c1c', accent: '#d97706' },
      { name: '22. Plum & Aqua', prim: '#c026d3', primDark: '#86198f', accent: '#06b6d4' },
      { name: '23. Slate Blue & Coral', prim: '#475569', primDark: '#334155', accent: '#f43f5e' },
      { name: '24. Sky Blue & Mustard', prim: '#0284c7', primDark: '#0369a1', accent: '#eab308' },
      { name: '25. Charcoal & Mint', prim: '#374151', primDark: '#1f2937', accent: '#10b981' },
      { name: '26. Terracotta & Sage', prim: '#c2410c', primDark: '#9a3412', accent: '#4d7c0f' },
      { name: '27. Periwinkle & Lemon', prim: '#818cf8', primDark: '#6366f1', accent: '#fde047' },
      { name: '28. Deep Violet & Azure', prim: '#5b21b6', primDark: '#4c1d95', accent: '#3b82f6' },
      { name: '29. Brick & Navy', prim: '#b91c1c', primDark: '#7f1d1d', accent: '#1e3a8a' },
      { name: '30. Cool Gray & Neon Pink', prim: '#64748b', primDark: '#475569', accent: '#ec4899' }
    ];

    const track = document.getElementById('track');
    const dotsContainer = document.getElementById('dots');

    const lightBg = '#f8fafc';
    const darkBg = '#0f172a';
    const lightPattern = `linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px)`;
    const darkPattern = `linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px)`;

    palettes.forEach((p, idx) => {
      const btnShadow = `0 8px 20px ${hexToRgba(p.prim, 0.35)}`;
      const accentShadow = `0 8px 20px ${hexToRgba(p.accent, 0.35)}`;
      const accentTextCol = (p.accent === '#fbbf24' || p.accent === '#f59e0b' || p.accent === '#eab308') ? '#000' : '#fff';
      const accentTextShadow = (p.accent === '#fbbf24' || p.accent === '#f59e0b' || p.accent === '#eab308') ? 'none' : '0 1px 2px rgba(0,0,0,0.2)';

      const html = `
      <div class="palette-section ${idx === 0 ? 'active' : ''}">
        <div class="palette-title" style="color: ${p.primDark}">${p.name}</div>
        
        <div class="grid">
          
          <!-- LIGHT MODE -->
          <div class="mode-container">
            <div class="mode-header light-header">Light Mode</div>
            <div class="preview-area light-preview" style="background-color: ${lightBg}; background-image: ${lightPattern};">
              <div class="mock-card light-card">
                <div class="mock-title" style="color: ${p.prim}">
                  <span style="font-family: 'Noto Sans SC', sans-serif;">中文</span> Learn
                </div>
                <div class="mock-text light-text">
                  This shows how body text and contrast look inside a glassmorphic card in Light Mode.
                  <div class="typo-demo">
                    <span style="font-weight: 700; color: ${p.primDark}">Typography Demo (${p.name})</span>
                    <span>The quick brown fox jumps over the lazy dog.</span>
                    <span style="font-family: 'Noto Sans SC', sans-serif;">你好，世界！这是测试文本。</span>
                  </div>
                </div>
                
                <button class="mock-btn" style="background: linear-gradient(135deg, ${p.prim}, ${p.primDark}); box-shadow: ${btnShadow};">
                  Primary Action
                </button>
                
                <button class="mock-btn" style="background: ${p.accent}; color: ${accentTextCol}; box-shadow: ${accentShadow}; text-shadow: ${accentTextShadow};">
                  Accent Action
                </button>
              </div>
            </div>
          </div>
          
          <!-- DARK MODE -->
          <div class="mode-container">
            <div class="mode-header dark-header">Dark Mode</div>
            <div class="preview-area dark-preview" style="background-color: ${darkBg}; background-image: ${darkPattern};">
              <div class="mock-card dark-card">
                <div class="mock-title" style="color: ${p.prim}">
                  <span style="font-family: 'Noto Sans SC', sans-serif;">中文</span> Learn
                </div>
                <div class="mock-text dark-text">
                  This shows how body text and contrast look inside a glassmorphic card in Dark Mode.
                  <div class="typo-demo">
                    <span style="font-weight: 700; color: ${p.prim}">Typography Demo (${p.name})</span>
                    <span>The quick brown fox jumps over the lazy dog.</span>
                    <span style="font-family: 'Noto Sans SC', sans-serif;">你好，世界！这是测试文本。</span>
                  </div>
                </div>
                
                <button class="mock-btn" style="background: linear-gradient(135deg, ${p.prim}, ${p.primDark}); box-shadow: ${btnShadow};">
                  Primary Action
                </button>
                
                <button class="mock-btn" style="background: ${p.accent}; color: ${accentTextCol}; box-shadow: ${accentShadow}; text-shadow: ${accentTextShadow};">
                  Accent Action
                </button>
              </div>
            </div>
          </div>
          
          <!-- SWATCHES -->
          <div class="swatches">
            <div class="swatch" style="background: ${p.prim}">Primary: ${p.prim}</div>
            <div class="swatch" style="background: ${p.primDark}">Dark: ${p.primDark}</div>
            <div class="swatch" style="background: ${p.accent}; color: ${accentTextCol}; text-shadow: ${accentTextShadow};">Accent: ${p.accent}</div>
          </div>
          
        </div>
      </div>
    `;
      track.innerHTML += html;

      // Add dot
      const dot = document.createElement('div');
      dot.className = `dot ${idx === 0 ? 'active' : ''}`;
      dot.addEventListener('click', () => goToSlide(idx));
      dotsContainer.appendChild(dot);
    });

    // Carousel Logic
    let currentIndex = 0;
    const slides = document.querySelectorAll('.palette-section');
    const dots = document.querySelectorAll('.dot');

    function updateCarousel() {
      track.style.transform = `translateX(-${currentIndex * 100}%)`;

      slides.forEach((s, idx) => {
        if (idx === currentIndex) s.classList.add('active');
        else s.classList.remove('active');
      });

      dots.forEach((d, idx) => {
        if (idx === currentIndex) d.classList.add('active');
        else d.classList.remove('active');
      });

      // update color of active dot
      const activeColor = palettes[currentIndex].prim;
      dots.forEach((d, idx) => {
        if (idx === currentIndex) {
          d.style.background = activeColor;
        } else {
          d.style.background = '#cbd5e1';
        }
      });
    }

    function goToSlide(index) {
      currentIndex = index;
      updateCarousel();
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentIndex = (currentIndex > 0) ? currentIndex - 1 : palettes.length - 1;
      updateCarousel();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentIndex = (currentIndex < palettes.length - 1) ? currentIndex + 1 : 0;
      updateCarousel();
    });

    // Initialize first dot color
    updateCarousel();
  </script>

</body>

</html>
